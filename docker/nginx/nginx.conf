# Production Nginx Reverse Proxy Configuration for yugendiran.in
# Architecture: Cloudflare Edge -> VPS Nginx (Ports 80/443) -> Internal Docker Network

# Upstream definitions for internal container communication
upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream backend_upstream {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yugendiran.in www.yugendiran.in localhost;

    # Maximum request body size (prevents oversized payload abuse at edge)
    client_max_body_size 64k;

    # Gzip Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 256;

    # Security Headers for Edge Proxy
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Forwarding Headers (Propagating genuine client IP and Cloudflare metadata)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";

    # Proxy Timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # Backend API: Proxy all /api/* requests strictly to Express backend
    location /api/ {
        proxy_pass http://backend_upstream;

        # Disable proxy caching for all dynamic API endpoints
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Health & Readiness Probes for External Orchestrator / VPS Monitoring
    location /health {
        proxy_pass http://backend_upstream;
        access_log off;
    }

    # Frontend Static Assets & SPA Routing: Proxy to frontend container
    location / {
        proxy_pass http://frontend_upstream;

        # WebSocket upgrade support if required for development/future protocols
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
