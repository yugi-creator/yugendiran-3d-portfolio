# Development Docker Compose Override
# Use: docker compose -f docker-compose.dev.yml up -d
# Spins up only local PostgreSQL and Redis with host ports exposed for local development

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres-dev
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis-dev
    command: redis-server --requirepass dev_password --appendonly no
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata_dev:
